version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: sms_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sms_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  webapi:
    image: sms-webapi
    container_name: sms_webapi_container
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=sms_db;Username=postgres;Password=password
    depends_on:
      - db

volumes:
  pgdata: